# Render Blueprint — deploys the SEET static site (no build step, files served as-is)
services:
  - type: web
    name: seet-website
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    routes:
      - type: redirect
        source: /foerderung
        destination: /programm.html
      - type: redirect
        source: /foerderung/foerdererprogramm
        destination: /programm.html
      - type: redirect
        source: /foerderung/bewerbungsablauf
        destination: /programm.html
      - type: redirect
        source: /foerderung/bewerbungsformular
        destination: /mitmachen.html
      - type: redirect
        source: /unterstuetze-uns
        destination: /mitmachen.html
      - type: redirect
        source: /unterstuetze-uns/werde-mentorin
        destination: /mitmachen.html#mentoring
      - type: redirect
        source: /unterstuetze-uns/werde-frewilliger
        destination: /mitmachen.html#team
      - type: redirect
        source: /unterstuetze-uns/werde-vereinsmitglied
        destination: /mitmachen.html#mitglied
      - type: redirect
        source: /unterstuetze-uns/werde-goennerin
        destination: /mitmachen.html#spenden
      - type: redirect
        source: /unterstuetze-uns/werde-partner
        destination: /mitmachen.html#partner
      - type: redirect
        source: /ueber-uns
        destination: /ueber-uns.html
      - type: redirect
        source: /ueber-uns/unsere-mission
        destination: /ueber-uns.html
      - type: redirect
        source: /ueber-uns/unsere-geschichte
        destination: /geschichte.html
      - type: redirect
        source: /ueber-uns/unser-team
        destination: /team.html
      - type: redirect
        source: /ueber-uns/unsere-awards
        destination: /awards.html
      - type: redirect
        source: /ueber-uns/unsere-partner
        destination: /partner.html
      - type: redirect
        source: /ueber-uns/unsere-goenner
        destination: /goenner.html
      - type: redirect
        source: /ueber-uns/faqs
        destination: /faqs.html
      - type: redirect
        source: /blog
        destination: /blog.html
      - type: redirect
        source: /blog/seetlinge
        destination: /blog.html
      - type: redirect
        source: /geschichten/seetlinge
        destination: /blog.html
      - type: redirect
        source: /kontakt
        destination: /kontakt.html
      - type: redirect
        source: /impressum
        destination: /impressum.html
      - type: redirect
        source: /datenschutzerklaerung
        destination: /datenschutz.html
      - type: redirect
        source: /die-teilnahme-an-diesem-seet-programm-hat-meine-erwartungen-uebertroffen
        destination: /blog.html#die-teilnahme-an-diesem-seet-programm-hat-meine-erwartungen-uebertroffen
      - type: redirect
        source: /eine-kleine-aber-bedeutungsvolle-moeglichkeit-etwas-zurckzugeben
        destination: /blog.html#eine-kleine-aber-bedeutungsvolle-moeglichkeit-etwas-zurckzugeben
      - type: redirect
        source: /der-seet-jahrgang-202627-startet-seine-mentoring-reise
        destination: /blog.html#der-seet-jahrgang-202627-startet-seine-mentoring-reise
      - type: redirect
        source: /der-jahresbericht-2025-von-seet-ist-jetzt-online-verfuegbar
        destination: /blog.html#der-jahresbericht-2025-von-seet-ist-jetzt-online-verfuegbar
