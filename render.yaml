        source: /seet-richtet-sich-an-zukuenftige-study-support-mentorinnen-bei-eth-diversity-veranstaltung
        destination: /blog.html#seet-richtet-sich-an-zukuenftige-study-support-mentorinnen-bei-eth-diversity-veranstaltung
      - type: redirect
        source: /teilnehmende-des-seet-studienfoerderprogramms-halten-inne
